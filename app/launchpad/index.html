<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Application Launchpad</title>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m, sap.ui.core"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-resourceroots='{
            "launchpad": "./"
        }'>
    </script>
    <script>
        sap.ui.getCore().attachInit(function() {
            new sap.m.App({
                pages: [
                    new sap.m.Page({
                        title: "Business Applications",
                        enableScrolling: true,
                        content: [
                            new sap.m.Panel({
                                headerText: "Benvenuto nel portale aziendale",
                                class: "sapUiResponsiveMargin",
                                width: "auto",
                                content: [
                                    new sap.m.Text({
                                        text: "Seleziona un'applicazione per iniziare"
                                    }).addStyleClass("sapUiSmallMargin")
                                ]
                            }),
                            new sap.m.TileContainer({
                                tiles: [
                                    new sap.m.StandardTile({
                                        icon: "sap-icon://sales-order",
                                        title: "Gestione Ordini",
                                        info: "Orders",
                                        infoState: "Success",
                                        number: "12",
                                        numberUnit: "Ordini Attivi",
                                        press: function() {
                                            window.location.href = "/orders/webapp/index.html";
                                        }
                                    }),
                                    new sap.m.StandardTile({
                                        icon: "sap-icon://product",
                                        title: "Catalogo Prodotti",
                                        info: "Products",
                                        infoState: "Warning",
                                        number: "156",
                                        numberUnit: "Prodotti",
                                        press: function() {
                                            window.location.href = "/products/webapp/index.html";
                                        }
                                    }),
                                    new sap.m.StandardTile({
                                        icon: "sap-icon://customer",
                                        title: "Gestione Clienti",
                                        info: "Customers",
                                        infoState: "Error",
                                        number: "89",
                                        numberUnit: "Clienti",
                                        press: function() {
                                            window.location.href = "/customers/webapp/index.html";
                                        }
                                    })
                                ]
                            })
                        ]
                    })
                ]
            }).placeAt("content");
        });
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #content {
            height: 100vh;
        }
    </style>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
